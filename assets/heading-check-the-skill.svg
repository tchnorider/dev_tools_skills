<svg xmlns="http://www.w3.org/2000/svg" width="400" height="44" viewBox="0 0 400 44" role="img" aria-label="Check the skill">
  <defs>
    <linearGradient id="frenchBlue" x1="0" y1="0" x2="400" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F7FF"/>
      <stop offset="12%" stop-color="#B8D4F0"/>
      <stop offset="28%" stop-color="#6BA3D6"/>
      <stop offset="44%" stop-color="#318CE7"/>
      <stop offset="58%" stop-color="#0055A4"/>
      <stop offset="76%" stop-color="#003E7E"/>
      <stop offset="100%" stop-color="#002654"/>
    </linearGradient>
    <linearGradient id="titleShine" x1="0" y1="0" x2="400" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#001A33" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000814" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="titleDepth" x="-2%" y="-20%" width="104%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="0.45" flood-color="#001A33" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#titleDepth)">
    <text
      x="1"
      y="33"
      font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
      font-size="32"
      font-weight="700"
      fill="url(#frenchBlue)"
    >Check the skill</text>
    <text
      x="1"
      y="33"
      font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
      font-size="32"
      font-weight="700"
      fill="url(#titleShine)"
      style="mix-blend-mode: overlay"
    >Check the skill</text>
  </g>
</svg>